name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 的新推送取消旧任务，避免浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # NDK 版本：与本项目开发环境一致（r28c / 28.2.13676358）。
  # 升级时请同步更新本地与 AGENTS.md 中的记录。
  NDK_VERSION: '28.2.13676358'
  MODULE_ID: miui_adbinput_bypass

jobs:
  build:
    name: Build module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 用 sdkmanager 只拉取 NDK，避免下载完整的 700MB+ 离线包
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          set -euo pipefail

          # 复用 runner 上已有的 SDK（含 cmdline-tools），避免重复下载
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "未找到 sdkmanager，回退为直接下载 NDK 离线包" >&2
            mkdir -p "$SDK/ndk"
            curl -fsSL -o /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
            unzip -q /tmp/ndk.zip -d "$SDK/ndk"
            mv "$SDK/ndk/android-ndk-r28c" "$SDK/ndk/$NDK_VERSION"
          else
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi

          # 校验 NDK 就位
          test -d "$SDK/ndk/$NDK_VERSION" || {
            echo "NDK 未安装到预期路径: $SDK/ndk/$NDK_VERSION" >&2
            ls -la "$SDK/ndk" >&2
            exit 1
          }
          echo "NDK=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # tag 形如 v1.0.0 -> 直接用
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            # 非 tag 构建：使用 0.0.0-g<短sha>，并给一个足够大的 versionCode
            echo "version=v0.0.0-g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # versionCode：用提交时间戳前 9 位，保证单调递增
          echo "code=$(git log -1 --format=%ct | cut -c1-9)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          MODULE_VERSION: ${{ steps.ver.outputs.version }}
          MODULE_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          chmod +x module/build.sh
          ./module/build.sh | tee /tmp/build.log

          ZIP="module/build/${MODULE_ID}-${MODULE_VERSION}.zip"
          test -f "$ZIP" || { echo "未生成 $ZIP" >&2; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$ZIP")" >> "$GITHUB_ENV"

      # 产物占位检查：确保 4 个 ABI 都在，且入口符号已导出
      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "== zip 内容 =="
          unzip -l "$ZIP"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            SO="module/build/$abi/$abi.so"
            test -f "$SO" || { echo "缺少 $abi 产物" >&2; exit 1; }
            # zygisk_module_entry 必须导出，否则 Magisk 无法加载
            if ! "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
                   --dyn-syms "$SO" | grep -q zygisk_module_entry; then
              echo "$abi 未导出 zygisk_module_entry" >&2
              exit 1
            fi
            # 不允许残留 C++ ABI 未解析符号
            if "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
                   --dyn-syms "$SO" | grep -E 'UND.*(__cxa_guard|cxxabi)'; then
              echo "$abi 仍有未解析的 C++ ABI 符号" >&2
              exit 1
            fi
            echo "OK: $abi"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MODULE_ID }}-${{ steps.ver.outputs.version }}
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 30

      # ---------- tag 时自动发布 Release ----------
      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          SHA=$(sed -n 's/^SHA256=//p' /tmp/build.log | head -1 || true)
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "自动构建产物（${{ github.sha }}），包含 4 个 ABI："
            echo '`arm64-v8a`、`armeabi-v7a`、`x86`、`x86_64`'
            echo
            echo '### 安装'
            echo
            echo "1. 下载 \`${ZIP_NAME}\`"
            echo '2. Magisk App → 模块 → 从本地安装'
            echo '3. 重启'
            echo
            echo '前提：Magisk 24.0+ 且已开启 Zygisk。详见 [README](README.zh-CN.md)。'
            echo
            if [ -n "$SHA" ]; then
              echo '### 校验值'
              echo
              echo '```'
              echo "SHA256: $SHA"
              echo '```'
            fi
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP }}
          body_path: /tmp/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
